name: Set up bats
description: >-
  The compiler at the commit .github/bats-version pins, the packages'
  repository, and the version the app is built as: what every job that
  checks or builds the app needs first (after a checkout two commits deep)
inputs:
  commit:
    description: The commit the version names (a pull request's own head, #219)
    required: true
runs:
  using: composite
  steps:
    - name: Install ATS2
      shell: bash
      run: |
        curl -sL "https://raw.githubusercontent.com/ats-lang/ats-lang.github.io/master/FROZEN000/ATS-Postiats/ATS2-Postiats-int-0.4.2.tgz" -o /tmp/ats2.tgz
        mkdir -p ~/.ats2
        tar -xzf /tmp/ats2.tgz -C ~/.ats2
        cd ~/.ats2/ATS2-Postiats-int-0.4.2
        make -j$(nproc) -C src/CBOOT patsopt
        mkdir -p bin
        cp src/CBOOT/patsopt bin/patsopt
        mkdir -p ~/.bats
        ln -sf ~/.ats2/ATS2-Postiats-int-0.4.2 ~/.bats/ats2

    - name: Install WASM tools
      shell: bash
      run: sudo apt-get install -y -q lld

    # The compiler at the commit .github/bats-version pins (#203)
    - name: Read the compiler pin
      id: pins
      shell: bash
      run: echo "bats=$(tr -d '[:space:]' < .github/bats-version)" >> "$GITHUB_OUTPUT"

    - name: Checkout bats compiler
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: bats-lang/bats
        ref: ${{ steps.pins.outputs.bats }}
        path: bats-src

    # The release build (-O2): bats's own work (lexing, the recursion
    # check, hashing the sources) takes half the time the debug build's
    # does, which a static fixture's check is mostly made of
    - name: Build bats from checked-in bootstrap C
      shell: bash
      run: |
        cp -R bats-src/bootstrap/c ~/bats-c
        make -j$(nproc) -C ~/bats-c PATSHOME=$HOME/.ats2/ATS2-Postiats-int-0.4.2 release/bats
        mkdir -p ~/bats-bin
        cp ~/bats-c/release/bats ~/bats-bin/bats
        rm -rf bats-src
        sudo cp $HOME/bats-bin/bats /bin/bats

    - name: Setup
      shell: bash
      run: |
        git clone --depth 1 https://github.com/bats-lang/repository-prototype.git $HOME/repository
        # The packages are the versions the committed bats.lock locks
        # (#203); bats check and build fetch exactly those, and fail on
        # a lock that does not match the project. Only a relock moves
        # them: never this workflow.
        test -f bats.lock || { echo "::error::bats.lock is missing: run 'bats lock --repository <dir>' and commit it"; exit 1; }

    # The version the app and gen-pwa are built with: the date and short
    # SHA of the commit built from, a pull request's own head (#219)
    - name: Write the version
      shell: bash
      env:
        QUIRE_COMMIT: ${{ inputs.commit }}
      run: scripts/version.sh
