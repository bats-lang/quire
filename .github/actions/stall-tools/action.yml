# The stall capture's native tools (quire#575, #591): gdb for the renderer's stacks and core, elfutils
# (eu-stack, its fallback when gdb cannot attach) and libc6-dbg (which names libc's internal
# functions). Called by check.yml's e2e jobs.
#
# A STOPGAP: pwa's e2e-setup action should install these and keep the runner's passwordless sudo
# (bats-lang/pwa#109); this action goes when that lands. A diagnostic for a rare freeze must not
# turn a job red, so the index is updated, the install retried, and a failure goes on (the capture
# uses gdb only if it is there, and the specs that need it skip, saying why, when it is not). The
# caller sets `continue-on-error: true` on the step that uses this action, so a failure here ends
# the step without ending the job.
name: stall-tools
description: Install gdb, elfutils and libc6-dbg for the e2e stall capture (quire#575, pwa#109)
runs:
  using: composite
  steps:
    - name: Install gdb, elfutils and libc6-dbg
      shell: bash
      run: |
        started=$(date +%s)
        installed=no
        for attempt in 1 2 3; do
          if sudo apt-get update -q && sudo apt-get install -y -q gdb elfutils; then installed=yes; break; fi
          [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
        done
        # libc6-dbg of exactly the installed libc6, never an upgrade of libc6 in the middle of a job
        # (it is pinned to its libc6's version); without it only libc's exported functions are named
        libc_version=$(dpkg-query -W -f='${Version}' libc6)
        sudo apt-get install -y -q --no-upgrade "libc6-dbg=$libc_version" \
          || echo "libc6-dbg $libc_version is not available: libc's internal functions stay unnamed"
        echo "Install gdb: installed=$installed after $(( $(date +%s) - started )) s"
        [ "$installed" = yes ]
