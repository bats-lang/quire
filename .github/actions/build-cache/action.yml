name: Compiler cache
description: >-
  Restores or saves what bats keeps between runs (a build/ directory, a
  fixtures memo) as a GitHub cache (#460, #622). Restore on a pull request
  and on the merge queue's group (#586); main's pushes and the nightly run
  build cold, and the pushes save, so every state of main is checked from
  nothing and is the base the pull requests and the queue start from.
  Save runs only after the job's work passed (put it last).
inputs:
  mode:
    description: restore or save
    required: true
  name:
    description: >-
      Which cache (build, static, static-memo-<group>), each its own key
      prefix. It must not end the way another name continues: the prefix is
      the name and "@", so "static" never finds "static-memo-rest@..."
    required: true
  path:
    description: >-
      What to keep, one path a line (a build/ directory, a memo directory)
    required: true
runs:
  using: composite
  steps:
    # A locator, and until bats-lang/bats#305 is fixed, the toolchain's pins
    # (#622). The key is the cache's name, the pins and the commit (a GitHub
    # cache is immutable, so a save needs a new key), and a restore takes the
    # newest cache of the name and pins. The rest is bats's: it stamps every
    # build/ with what made it and drops one whose stamp differs, rebuilds a
    # module whose source hash changed, and keys each memo entry by what it
    # read (bats's CLAUDE.md). It names no version a developer bumps, no
    # runner image, no lock, no bats.toml and no hash of the sources, so a
    # new input of those needs no new key part. What stays is the two pins
    # that make the toolchain, because bats#305 (open): build/.bats_toolchain,
    # which the stamp is built from, is trusted across processes, so a build/
    # restored from another ATS2 install or a patsopt edited in place can pass
    # the stamp as the same toolchain. The compiler's commit
    # (.github/bats-version, whose compiler holds the ATS2 pin) and the commit
    # of bats's setup action (which installs them) go when that is fixed and
    # quire's pin is past the fix.
    - name: Name the cache
      id: key
      shell: bash
      run: |
        pins=$( { cat .github/bats-version; grep -rhoE 'bats-lang/bats/\.github/actions/setup@[0-9a-f]{40}' .github/workflows | sort -u; } | sha256sum | cut -c1-16)
        echo "prefix=quire-${{ inputs.name }}@${pins}-" >> "$GITHUB_OUTPUT"
        echo "key=quire-${{ inputs.name }}@${pins}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

    - name: Restore the compiler cache
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Save the compiler cache
      if: inputs.mode == 'save'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
