name: Compiler cache
description: >-
  Restores or saves what bats keeps between runs (a build/ directory, a
  fixtures memo) as a GitHub cache (#460, #622). Restore on a pull request
  and on the merge queue's group (#586); main's pushes and the nightly run
  build cold, and the pushes save, so every state of main is checked from
  nothing and is the base the pull requests and the queue start from.
  Save runs only after the job's work passed (put it last).
inputs:
  mode:
    description: restore or save
    required: true
  name:
    description: >-
      Which cache (build, static, static-memo-<group>), each its own key
      prefix. It must not end the way another name continues: the prefix is
      the name and "@", so "static" never finds "static-memo-rest@..."
    required: true
  path:
    description: >-
      What to keep, one path a line (a build/ directory, a memo directory)
    required: true
runs:
  using: composite
  steps:
    # A locator (#622). The key is the cache's name and the commit (a GitHub
    # cache is immutable, so a save needs a new key), and a restore takes the
    # newest cache of the name. The "@" ends the name, so "static" never finds
    # "static-memo-rest@...". No pin, runner image, lock or source hash is in
    # it: bats judges what a restore holds (bats's CLAUDE.md). It stamps every
    # build/ with what made it and drops one whose stamp differs, rebuilds a
    # module whose content changed, and keys each memo entry by what it read.
    # A restore that is wrong costs time, never a wrong result.
    - name: Name the cache
      id: key
      shell: bash
      run: |
        echo "prefix=quire-${{ inputs.name }}@" >> "$GITHUB_OUTPUT"
        echo "key=quire-${{ inputs.name }}@${{ github.sha }}" >> "$GITHUB_OUTPUT"

    - name: Restore the compiler cache
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Save the compiler cache
      if: inputs.mode == 'save'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
