name: Compiler cache
description: >-
  Restores or saves what bats keeps between runs (a build/ directory, a
  fixtures memo) as a GitHub cache (#460, #622). Restore on a pull request
  and on the merge queue's group (#586); main's pushes and the nightly run
  build cold, and the pushes save, so every state of main is checked from
  nothing and is the base the pull requests and the queue start from.
  Save runs only after the job's work passed (put it last).
inputs:
  mode:
    description: restore or save
    required: true
  name:
    description: >-
      Which cache (build, static, static-memo-<group>), each its own key
      prefix. It must not end the way another name continues: the prefix is
      the name and "@", so "static" never finds "static-memo-rest@..."
    required: true
  path:
    description: >-
      What to keep, one path a line (a build/ directory, a memo directory)
    required: true
runs:
  using: composite
  steps:
    # A locator, the toolchain's pins and the lock (#622). The key is the
    # cache's name, the pins, the hash of bats.lock and the commit (a GitHub
    # cache is immutable, so a save needs a new key), and a restore takes the
    # newest cache of the name, pins and lock. The rest is bats's: it stamps
    # every build/ with what made it and drops one whose stamp differs,
    # rebuilds a module whose source hash changed, and keys each memo entry by
    # what it read (bats's CLAUDE.md). It names no version a developer bumps,
    # no runner image, no bats.toml and no hash of the sources.
    # The pins stay, and so does the lock: bats#323 (build mode keys a
    # module's C on its own .dats, not on the dependency .dats it staloads, so
    # a relock that changes a template body only is not noticed) and bats#320
    # (the profile is in no object key) are open. #682 had dropped the lock
    # because bats judges dependency files; in build mode it does not. Both
    # the pins and bats.lock may leave the key when bats#323 and bats#320 are
    # fixed and quire's bats pin is past them (.claude/rules/ci.md).
    - name: Name the cache
      id: key
      shell: bash
      run: |
        pins=$( { cat .github/bats-version; grep -rhoE 'bats-lang/bats/\.github/actions/setup@[0-9a-f]{40}' .github/workflows | sort -u; } | sha256sum | cut -c1-16)
        echo "prefix=quire-${{ inputs.name }}@${pins}-${{ hashFiles('bats.lock') }}-" >> "$GITHUB_OUTPUT"
        echo "key=quire-${{ inputs.name }}@${pins}-${{ hashFiles('bats.lock') }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

    - name: Restore the compiler cache
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Save the compiler cache
      if: inputs.mode == 'save'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
