name: Compiler cache
description: >-
  Restores or saves a bats build/ directory (#460). Restore on a pull request
  and on the merge queue's group (#586); main's pushes and the nightly run
  build cold, and the pushes save, so every state of main is checked from
  nothing and is the base the pull requests and the queue start from.
  Save runs only after the job's work passed (put it last).
inputs:
  mode:
    description: restore or save
    required: true
  name:
    description: Which cache (build, static), each its own key prefix
    required: true
  path:
    description: The build/ directory, at a path that is the same in every job
    required: true
runs:
  using: composite
  steps:
    # A locator, not a guarantee (#622): bats stamps every build/ with what
    # made it (the bats, patsopt and ATS2, the C compiler, the flags and the
    # target: build/.bats_stamp, bats-lang/bats#273) and drops a build/ whose
    # stamp is not the one it would write, so the key no longer names the
    # compiler pin, the ATS2 pin or the runner image. What is left is what
    # the stamp does not cover: the packages (the lock, bats.toml), the
    # system and architecture the cache was made on, and the commit of bats's
    # setup action, which installs ATS2 and builds the compiler (#623; the key
    # still names the commit that does). The sources are the
    # key's last part, so an exact hit is the same sources, and a prefix hit
    # the newest earlier build of the same packages. The commit's facts
    # (build/src/_bats_facts, which src/version.bats words) are written
    # again per commit and change only their own module.
    - name: Name the cache
      id: key
      shell: bash
      run: |
        # ATS2 and the way the compiler is built are bats's setup action's,
        # called by commit: that commit names them (bats#280)
        setup=$(grep -rhoE 'bats-lang/bats/\.github/actions/setup@[0-9a-f]{40}' .github/workflows | sort -u | sha256sum | cut -c1-16)
        echo "prefix=quire-${{ inputs.name }}-v2-${{ runner.os }}-${{ runner.arch }}-${setup}-${{ hashFiles('bats.lock', 'bats.toml') }}-" >> "$GITHUB_OUTPUT"
        echo "sources=${{ hashFiles('src/**') }}" >> "$GITHUB_OUTPUT"

    - name: Restore the compiler cache
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.prefix }}${{ steps.key.outputs.sources }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Save the compiler cache
      if: inputs.mode == 'save'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.prefix }}${{ steps.key.outputs.sources }}
