# One job of the hunt (quire#575): a fresh runner runs the start of the desktop project of a group, in
# check.yml's order, with the environment of its arm, and says what happened. The three arms run these
# same steps and differ only in the environment of the test step, so the runner and its first minute are
# the same: the unit of the flake's rate is a fresh job. Called by hunt.yml's two matrices.
name: hunt-job
description: One fresh-runner job of the hunt for quire#575
inputs:
  arm:
    description: full, noarm or bare (scripts/hunt.py)
    required: true
  group:
    description: the e2e group (tests/groups.json)
    required: true
  n:
    description: the job's number in the dispatch
    required: true
  seconds:
    description: how long each of gen-pwa test's runs may go (Playwright's global timeout)
    required: true
runs:
  using: composite
  steps:
    - name: Download the PWA
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: hunt-pwa
        path: dist/pwa

    - name: Download the PWA generator
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: hunt-gen-pwa
        path: dist/debug

    - name: Make the generator runnable and add the home page
      shell: bash
      run: |
        chmod +x dist/debug/gen-pwa
        cp -R homepage dist/pwa/homepage

    # The steps of check.yml's e2e job, in its order: a fresh runner's first minute is what the flake needs
    - name: Set up Node.js and Playwright
      uses: bats-lang/pwa/.github/actions/e2e-setup@ea8a14aaaffbca00c6a740cc481e51f7d594e07d # pwa main after #124 (no release tag)
      with:
        playwright-minimum: "1.58"

    - name: Install a CJK font
      shell: bash
      run: sudo apt-get install -y -q fonts-noto-cjk

    - name: Install gdb
      continue-on-error: true
      uses: ./.github/actions/stall-tools

    # The arm is the environment and nothing else. An empty value is unset to the watch.
    - name: Run the start of the group on the desktop project
      id: run
      continue-on-error: true
      shell: bash
      run: |
        specs=$(scripts/ci-groups.py members e2e "$HUNT_GROUP")
        mkdir -p "$RUNNER_TEMP/e2e-timings"
        ./dist/debug/gen-pwa test --timings "$RUNNER_TEMP/e2e-timings" -- --project=desktop --global-timeout=$((HUNT_SECONDS * 1000)) --reporter=list,json $specs
      env:
        HUNT_GROUP: ${{ inputs.group }}
        HUNT_SECONDS: ${{ inputs.seconds }}
        PLAYWRIGHT_HTML_OPEN: never
        QUIRE_NO_STALL_ARM: ${{ inputs.arm == 'noarm' && '1' || '' }}
        QUIRE_STALL_WATCH: ${{ inputs.arm == 'bare' && 'off' || '' }}
        QUIRE_NO_RECORDER: ${{ inputs.arm == 'bare' && '1' || '' }}

    - name: Say what the job found
      id: classify
      if: always()
      shell: bash
      run: |
        python3 scripts/hunt.py classify "$HUNT_ARM" "$HUNT_GROUP" "$HUNT_N" test-results "$RUNNER_TEMP/e2e-timings" "$RUNNER_TEMP/hunt-result" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "run step outcome: ${{ steps.run.outcome }}" >> "$GITHUB_STEP_SUMMARY"
      env:
        HUNT_ARM: ${{ inputs.arm }}
        HUNT_GROUP: ${{ inputs.group }}
        HUNT_N: ${{ inputs.n }}

    - name: Keep the result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: hunt-result-${{ inputs.arm }}-${{ inputs.n }}
        path: ${{ runner.temp }}/hunt-result/result.json
        if-no-files-found: ignore
        retention-days: 3

    # Only a job that hit uploads its evidence: the capture, the flight recorder's two rings, the traces
    - name: Keep the evidence of a hit
      if: always() && steps.classify.outputs.hit == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: hunt-hit-${{ inputs.arm }}-${{ inputs.n }}
        path: |
          test-results/**/stall-capture-*.json
          test-results/**/runner-load-*.json
          test-results/**/page-timing-*.json
          test-results/**/flight-*.gz
          test-results/**/*.zip
          ${{ runner.temp }}/hunt-result/result.json
        if-no-files-found: ignore
        retention-days: 30

    # a core holds the renderer's memory (the e2e fixtures' pages, never a user's): 7 days, as check.yml keeps it
    - name: Keep the core of a hit
      if: always() && steps.classify.outputs.hit == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: hunt-core-${{ inputs.arm }}-${{ inputs.n }}
        path: test-results/**/stall-core-*.core.gz
        if-no-files-found: ignore
        retention-days: 7
