# Keeps the npm pins and the action pins moving through reviewed pull requests
# (bridge#174; the shape of bridge's and dom's files); which tool moves which pin: .claude/rules/ci.md, "Node's packages".
#
# One pull request for all of them (#795): the group below spans both ecosystems, so a weekly run opens one
# pull request and one `check` run, not one for each update (.claude/rules/ci.md, "Node's packages").
#
# npm: the root package.json and package-lock.json (@playwright/test, the Chromium it runs).
# github-actions: the workflows' actions pinned by commit with their release comments.
# bats-lang/* is ignored: the daily relock and the hand moves own those (CLAUDE.md, "CI is pinned").
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    patterns: ["*"]
updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    # a release is a week old before it is proposed, so a compromised one can be noticed first
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: bats-lang/*
