name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ATS2
        run: |
          curl -sL "https://raw.githubusercontent.com/ats-lang/ats-lang.github.io/master/FROZEN000/ATS-Postiats/ATS2-Postiats-int-0.4.2.tgz" -o /tmp/ats2.tgz
          mkdir -p ~/.ats2
          tar -xzf /tmp/ats2.tgz -C ~/.ats2
          cd ~/.ats2/ATS2-Postiats-int-0.4.2
          make -j$(nproc) -C src/CBOOT patsopt
          mkdir -p bin
          cp src/CBOOT/patsopt bin/patsopt
          mkdir -p ~/.bats
          ln -sf ~/.ats2/ATS2-Postiats-int-0.4.2 ~/.bats/ats2

      - name: Install WASM tools
        run: sudo apt-get install -y -q lld

      # The compiler at the commit .github/bats-version pins (#203)
      - name: Read the compiler pin
        id: pins
        run: echo "bats=$(tr -d '[:space:]' < .github/bats-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout bats compiler
        uses: actions/checkout@v4
        with:
          repository: bats-lang/bats
          ref: ${{ steps.pins.outputs.bats }}
          path: bats-src

      - name: Build bats from checked-in bootstrap C
        run: |
          cp -R bats-src/bootstrap/c ~/bats-c
          make -j$(nproc) -C ~/bats-c PATSHOME=$HOME/.ats2/ATS2-Postiats-int-0.4.2 debug/bats
          mkdir -p ~/bats-bin
          cp ~/bats-c/debug/bats ~/bats-bin/bats
          rm -rf bats-src

      - name: Setup
        run: |
          sudo cp $HOME/bats-bin/bats /bin/bats
          git clone --depth 1 https://github.com/bats-lang/repository-prototype.git $HOME/repository
          # The packages are the versions the committed bats.lock locks
          # (#203); bats check and build fetch exactly those, and fail on
          # a lock that does not match the project. Only a relock moves
          # them: never this workflow.
          test -f bats.lock || { echo "::error::bats.lock is missing: run 'bats lock --repository <dir>' and commit it"; exit 1; }

      # The version: the date and short SHA of the commit deployed (#219)
      - name: Write the version
        run: scripts/version.sh

      - name: Build the app and the PWA generator
        run: |
          bats build --repository $HOME/repository

      - name: Generate PWA
        run: ./dist/debug/gen-pwa

      # The OAuth clients it signs in with: public IDs, from the
      # repository's variables (a secret of the same name works too)
      - name: Sync clients
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
          DROPBOX_CLIENT_ID: ${{ vars.DROPBOX_CLIENT_ID || secrets.DROPBOX_CLIENT_ID }}
        run: scripts/sync-clients.sh dist/pwa

      # The home page, privacy policy and terms (#216), published beside
      # the app at homepage/. They are not the app's: gen-pwa does not
      # read them, the Android project does not hold them, and the
      # service worker leaves them to the network
      - name: Add the home page
        run: cp -R homepage dist/pwa/homepage

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pwa

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
