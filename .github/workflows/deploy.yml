name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up bats
        uses: bats-lang/bats/.github/actions/setup@a392d19a4556b724c8b6ceb7498630e133fba937 # the setup action (bats#280)

      # The version is the date and short SHA of the commit deployed
      # (#219): HEAD's, which bats writes as the commit's facts
      # (src/version.bats words them)
      - name: Build the app and the PWA generator
        run: bats build

      - name: Generate PWA
        run: ./dist/debug/gen-pwa

      # The OAuth clients it signs in with: public IDs, committed in
      # scripts/sync-clients.env
      - name: Sync clients
        run: scripts/sync-clients.sh dist/pwa

      # The home page, privacy policy and terms (#216), published beside
      # the app at homepage/. They are not the app's: gen-pwa does not
      # read them, the Android project does not hold them, and the
      # service worker leaves them to the network
      - name: Add the home page
        run: cp -R homepage dist/pwa/homepage

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pwa

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
