name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bats
        uses: bats-lang/bats/.github/actions/setup@dbb89146665e9b5fe281579794cc7b7446739d9c # the setup action (bats#280)

      # The version is the date and short SHA of the commit deployed
      # (#219): HEAD's, which bats writes as the commit's facts
      # (src/version.bats words them)
      - name: Build the app and the PWA generator
        run: bats build

      - name: Generate PWA
        run: ./dist/debug/gen-pwa

      # The OAuth clients it signs in with: public IDs, committed in
      # scripts/sync-clients.env
      - name: Sync clients
        run: scripts/sync-clients.sh dist/pwa

      # The home page, privacy policy and terms (#216), published beside
      # the app at homepage/. They are not the app's: gen-pwa does not
      # read them, the Android project does not hold them, and the
      # service worker leaves them to the network
      - name: Add the home page
        run: cp -R homepage dist/pwa/homepage

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pwa

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
