# Relocks a bats project and moves its CI pins to their newest, as a pull
# request that its check workflow runs on (bats-lang/quire#203). Nothing
# in it is the caller's own: what differs comes in as inputs, so it can
# move to bats-lang/repository-prototype unchanged (#269). A caller:
#
#   on:
#     schedule:
#       - cron: '17 5 * * *'
#     workflow_dispatch:
#   permissions:
#     contents: write        # push relock/<date>
#     pull-requests: write   # open its pull request
#     actions: write         # dispatch the check workflow on it
#     issues: write          # say when a setting stops the pull request
#   jobs:
#     relock:
#       uses: ./.github/workflows/relock-pins.yml
#       secrets: inherit
#       with:
#         workflow-pins: |
#           bats-lang/pwa/.github/workflows/android.yml
#
# The caller's pins: bats.lock (the packages), .github/bats-version (the
# compiler's commit) and each reusable workflow named in workflow-pins,
# called from .github/workflows as <owner>/<repo>/<path>@<commit>. A run
#
# - builds the compiler at its repository's newest main, relocks against
#   the newest package repository, and moves the compiler and each
#   workflow pin to its repository's newest main commit;
# - when anything changed, pushes relock/<date> and opens a pull request
#   listing each old and new version, closing older relock pull requests;
# - dispatches the check workflow on that branch: a pull request opened
#   with GITHUB_TOKEN starts no workflow, and workflow_dispatch is the
#   documented exception. A breaking publish then shows as a red relock
#   pull request, and main stays green.
#
# GITHUB_TOKEN cannot change files in .github/workflows. With a
# RELOCK_TOKEN secret (a fine-grained token on the repository with
# Contents, Pull requests and Workflows read and write) the workflow pins
# move too, and its pull request starts the checks itself; without one, a
# workflow pin that would move is listed in the pull request instead.
#
# Opening the pull request with GITHUB_TOKEN needs the repository setting
# "Allow GitHub Actions to create and approve pull requests". When it is
# off, the run still pushes the branch and dispatches the check, opens a
# "human only" issue with the steps that turn it on, and fails.
name: relock-pins

on:
  workflow_call:
    inputs:
      workflow-pins:
        description: Reusable workflows the caller pins by commit, <owner>/<repo>/<path> one per line
        type: string
        default: ''
      check-workflow:
        description: The workflow dispatched on the relock branch
        type: string
        default: check.yml
      package-repository:
        description: The package repository bats lock resolves against
        type: string
        default: bats-lang/repository-prototype
      compiler-repository:
        description: The bats compiler's repository, whose main .github/bats-version moves to
        type: string
        default: bats-lang/bats
      base:
        description: The branch relocked and the pull request's base
        type: string
        default: main
    secrets:
      RELOCK_TOKEN:
        required: false

jobs:
  relock:
    runs-on: ubuntu-latest
    env:
      PINS: ${{ inputs.workflow-pins }}
      CHECK_WORKFLOW: ${{ inputs.check-workflow }}
      PACKAGE_REPOSITORY: ${{ inputs.package-repository }}
      COMPILER_REPOSITORY: ${{ inputs.compiler-repository }}
      BASE: ${{ inputs.base }}
      HAS_RELOCK_TOKEN: ${{ secrets.RELOCK_TOKEN != '' }}
      GH_TOKEN: ${{ secrets.RELOCK_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base }}
          token: ${{ secrets.RELOCK_TOKEN || github.token }}

      - name: Install ATS2
        run: |
          curl -sL "https://raw.githubusercontent.com/ats-lang/ats-lang.github.io/master/FROZEN000/ATS-Postiats/ATS2-Postiats-int-0.4.2.tgz" -o /tmp/ats2.tgz
          mkdir -p ~/.ats2
          tar -xzf /tmp/ats2.tgz -C ~/.ats2
          cd ~/.ats2/ATS2-Postiats-int-0.4.2
          make -j$(nproc) -C src/CBOOT patsopt
          mkdir -p bin
          cp src/CBOOT/patsopt bin/patsopt
          mkdir -p ~/.bats
          ln -sf ~/.ats2/ATS2-Postiats-int-0.4.2 ~/.bats/ats2

      - name: Build the newest compiler
        run: |
          set -eu
          git clone -q "https://github.com/$COMPILER_REPOSITORY.git" ~/bats-src
          git -C ~/bats-src rev-parse HEAD > ~/compiler-newest
          cp -R ~/bats-src/bootstrap/c ~/bats-c
          make -j$(nproc) -C ~/bats-c PATSHOME=$HOME/.ats2/ATS2-Postiats-int-0.4.2 debug/bats
          sudo cp ~/bats-c/debug/bats /usr/local/bin/bats

      - name: Relock and move the pins
        run: |
          set -eu
          mkdir -p ~/relock
          # What was pinned, for the pull request's lists
          if [ -f bats.lock ]; then cp bats.lock ~/relock/old.lock; else : > ~/relock/old.lock; fi
          compiler_old=$(tr -d '[:space:]' < .github/bats-version 2>/dev/null || true)
          compiler_new=$(cat ~/compiler-newest)

          git clone -q --depth 1 "https://github.com/$PACKAGE_REPOSITORY.git" ~/repository
          bats lock --repository ~/repository
          printf '%s\n' "$compiler_new" > .github/bats-version

          # Each workflow pin, to its repository's newest main commit
          : > ~/relock/pins
          for pin in $PINS; do
            owner_repo=$(printf '%s' "$pin" | cut -d/ -f1-2)
            newest=$(git ls-remote "https://github.com/$owner_repo.git" refs/heads/main | cut -f1)
            test -n "$newest" || { echo "::error::no main in $owner_repo"; exit 1; }
            pattern=$(printf '%s' "$pin" | sed 's/\./\\./g')
            old=$(grep -rhoE "$pattern@[^[:space:]]+" .github/workflows | head -1 | sed 's/.*@//')
            test -n "$old" || { echo "::error::no workflow in .github/workflows calls $pin"; exit 1; }
            if [ "$old" != "$newest" ]; then
              grep -rlE "$pattern@" .github/workflows | xargs sed -i -E "s|$pattern@[^[:space:]]+|$pin@$newest|g"
              printf '%s %s %s %s\n' "$pin" "$owner_repo" "$old" "$newest" >> ~/relock/pins
            fi
          done

          # The workflow pins stay where they are when GITHUB_TOKEN would
          # have to change workflow files, which it cannot
          : > ~/relock/pins-left
          if [ "$HAS_RELOCK_TOKEN" != true ] && [ -s ~/relock/pins ]; then
            git checkout -- .github/workflows
            mv ~/relock/pins ~/relock/pins-left
            : > ~/relock/pins
            while read -r pin owner_repo old new; do
              echo "::warning::$pin is pinned at $old; its newest is $new. GITHUB_TOKEN cannot change workflow files: move it in a pull request, or give this workflow a RELOCK_TOKEN secret."
            done < ~/relock/pins-left
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to relock: the lock and the compiler are the newest." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=no" > ~/relock/state
            exit 0
          fi
          echo "changed=yes" > ~/relock/state

          # The pull request's text: each version that moved
          {
            echo "The daily relock (bats-lang/quire#203): the packages relocked against the newest \`$PACKAGE_REPOSITORY\`, and the CI pins moved to their newest."
            echo
            echo "### Packages (\`bats.lock\`)"
            echo
            awk 'NR == FNR { old[$1] = $2; next } { new[$1] = $2 }
              END {
                for (p in new) if (!(p in old)) print p, "(none)", new[p]
                for (p in new) if ((p in old) && old[p] != new[p]) print p, old[p], new[p]
                for (p in old) if (!(p in new)) print p, old[p], "(none)"
              }' ~/relock/old.lock bats.lock | sort > ~/relock/packages
            if [ -s ~/relock/packages ]; then
              echo "| Package | Old | New |"
              echo "|---|---|---|"
              while read -r name old new; do echo "| \`$name\` | $old | $new |"; done < ~/relock/packages
            else
              echo "No package moved."
            fi
            echo
            echo "### Compiler (\`.github/bats-version\`)"
            echo
            if [ "$compiler_old" = "$compiler_new" ]; then
              echo "Unchanged: \`$compiler_new\`."
            else
              echo "\`${compiler_old:-(none)}\` → \`$compiler_new\` ([changes](https://github.com/$COMPILER_REPOSITORY/compare/$compiler_old...$compiler_new))"
            fi
            if [ -s ~/relock/pins ] || [ -s ~/relock/pins-left ]; then
              echo
              echo "### Workflows"
              echo
              while read -r pin owner_repo old new; do
                echo "- \`$pin\`: \`$old\` → \`$new\` ([changes](https://github.com/$owner_repo/compare/$old...$new))"
              done < ~/relock/pins
              while read -r pin owner_repo old new; do
                echo "- \`$pin\` **not moved**: its newest is \`$new\` (now \`$old\`, [changes](https://github.com/$owner_repo/compare/$old...$new)). GITHUB_TOKEN cannot change files in \`.github/workflows\`: move it in a pull request, or give this workflow a \`RELOCK_TOKEN\` secret that can."
              done < ~/relock/pins-left
            fi
            echo
            echo "If a check here fails, a newer version broke this project: fix it on this branch (or in a pull request of its own that commits the lock), and main stays green meanwhile."
          } > ~/relock/body.md
          cat ~/relock/body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Push the branch, open the pull request and dispatch the check
        run: |
          set -eu
          grep -q '^changed=yes$' ~/relock/state || exit 0
          branch="relock/$(date -u +%Y-%m-%d)"
          repo="$GITHUB_REPOSITORY"
          git checkout -q -B "$branch"
          git add -A bats.lock .github
          title="Relock packages and CI pins ($(date -u +%Y-%m-%d))"
          { echo "$title"; echo; cat ~/relock/body.md; } > ~/relock/message
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -F ~/relock/message
          git push --force origin "$branch"

          number=$(gh pr list --repo "$repo" --head "$branch" --state open --json number --jq '.[0].number // empty')
          opened=yes
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$repo" --title "$title" --body-file ~/relock/body.md
          elif gh pr create --repo "$repo" --base "$BASE" --head "$branch" \
              --title "$title" --body-file ~/relock/body.md > ~/relock/pr.out 2> ~/relock/pr.err; then
            number=$(gh pr list --repo "$repo" --head "$branch" --state open --json number --jq '.[0].number')
          else
            cat ~/relock/pr.err
            opened=no
          fi

          # The check runs on the branch's commit either way, so its result
          # shows on the pull request. A token other than GITHUB_TOKEN
          # starts the pull request's checks by itself.
          if [ "$HAS_RELOCK_TOKEN" != true ]; then
            gh workflow run "$CHECK_WORKFLOW" --repo "$repo" --ref "$branch"
          fi

          if [ "$opened" = yes ]; then
            # An older relock is superseded by this one
            gh pr list --repo "$repo" --state open --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"relock/\")) | select(.headRefName != \"$branch\") | .number" |
            while read -r older; do
              gh pr close "$older" --repo "$repo" --delete-branch --comment "Superseded by #$number."
            done
            echo "Relock pull request: #$number" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if grep -qi "not permitted to create or approve pull requests" ~/relock/pr.err; then
            issue_title='Allow GitHub Actions to create pull requests, for the daily relock'
            if [ -z "$(gh issue list --repo "$repo" --state open --search "\"$issue_title\" in:title" --json number --jq '.[0].number // empty')" ]; then
              cat > ~/relock/issue.md <<ISSUE
          The daily relock (\`.github/workflows/relock.yml\`, #203) pushed \`$branch\` and started \`$CHECK_WORKFLOW\` on it, but could not open its pull request: the repository does not allow GitHub Actions to create pull requests. Only a repository administrator can change that.

          1. Open https://github.com/$repo/settings/actions (the repository's **Settings**, then **Actions** → **General** in the left sidebar).
          2. Scroll to **Workflow permissions**.
          3. Tick **Allow GitHub Actions to create and approve pull requests**, then click **Save**.
             If the box cannot be ticked, the organization turned it off: an organization owner opens https://github.com/organizations/${repo%%/*}/settings/actions, ticks the same box under **Workflow permissions**, clicks **Save**, and then does step 3 here.
          4. Run the relock again: https://github.com/$repo/actions/workflows/relock.yml → **Run workflow**. It opens the pull request for \`$branch\`.

          The run that failed: $GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID
          ISSUE
              gh issue create --repo "$repo" --title "$issue_title" --label "human only" --body-file ~/relock/issue.md
            fi
            echo "::error::Could not open the relock pull request: the repository setting \"Allow GitHub Actions to create and approve pull requests\" (Settings → Actions → General → Workflow permissions) is off. $branch is pushed and $CHECK_WORKFLOW dispatched on it; a \"human only\" issue says how to turn the setting on."
          else
            echo "::error::Could not open the relock pull request for $branch (see the output above)."
          fi
          exit 1
