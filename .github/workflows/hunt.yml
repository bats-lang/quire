name: hunt

# quire#575 (and #736): repeat the specs of a flake whose cause is not known, on CI's
# runner, with the stall capture armed, to make its next hit arrive with its evidence.
# Dispatch only: never on a push, a pull request, a schedule or the merge queue. The
# dispatcher checks `qsweep pressure` first (the runners are the scarce resource).
#
# Each shard repeats the specs with Playwright's own --repeat-each, through
# gen-pwa test (as the e2e groups do), and stops at its first failing test
# (--max-failures=1: a hit is a test that times out with an unresponsive page). A
# shard that hits uploads its stall captures and the failed tests' traces; the job
# summary says whether a capture arrived.

# Reads the repository only: no token write, no statuses, no artifacts' API use
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      specs:
        description: 'Spec files in e2e/, space separated (each must match name.spec.js; at least one)'
        required: true
        default: 'dictionary.spec.js containers.spec.js encodings.spec.js icons.spec.js'
        type: string
      repeat:
        description: 'Repetitions of each test, in each shard (a number from 1 to 1000)'
        required: true
        default: '100'
        type: string
      project:
        description: 'The Playwright project (a name of playwright.config.js: desktop, mobile-portrait, narrow, android, mobile-landscape, tablet, wide)'
        required: true
        default: 'desktop'
        type: string

jobs:
  # The app and the PWA, built once for the shards. This is check.yml's build job without its
  # caches, Android and checks: the hunt needs the web app only (a copy, by decision: see the PR
  # body of quire#748, why check.yml's job is not called as a reusable workflow)
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up bats
        uses: bats-lang/bats/.github/actions/setup@2ea56e16919a87077b793f2b08201de4fbc509bd # the setup action (bats#280)

      - name: Build the app and the PWA generator
        run: bats build

      - name: Generate PWA
        run: ./dist/debug/gen-pwa

      - name: Sync clients
        run: scripts/sync-clients.sh dist/pwa

      - name: Add the home page
        run: cp -R homepage dist/pwa/homepage

      - name: Upload the PWA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hunt-pwa
          path: dist/pwa
          retention-days: 1

      - name: Upload the PWA generator
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hunt-gen-pwa
          path: dist/debug/gen-pwa
          retention-days: 1

  hunt:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: hunt (shard ${{ matrix.shard }})
    env:
      HUNT_SPECS: ${{ inputs.specs }}
      HUNT_REPEAT: ${{ inputs.repeat }}
      HUNT_PROJECT: ${{ inputs.project }}
    steps:
      # The checkout comes first: the input check reads e2e/ (the specs must exist)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The inputs name files, a number and a project: anything else fails the shard before a browser
      # starts. Shell, not bats: no compiler exists before the build, and this runs ahead of it
      - name: Check the inputs
        run: |
          set -- $HUNT_SPECS
          [ "$#" -gt 0 ] || { echo "::error::specs is empty: name at least one spec file in e2e/ (an empty list would run every e2e test)"; exit 1; }
          for spec in $HUNT_SPECS; do
            printf '%s\n' "$spec" | grep -Eq '^[a-z0-9-]+\.spec\.js$' || { echo "::error::not a spec file in e2e/: $spec"; exit 1; }
            test -f "e2e/$spec" || { echo "::error::no such spec: e2e/$spec"; exit 1; }
          done
          printf '%s\n' "$HUNT_REPEAT" | grep -Eq '^([1-9][0-9]{0,2}|1000)$' || { echo "::error::repeat must be from 1 to 1000: $HUNT_REPEAT"; exit 1; }
          # the names of the projects in playwright.config.js (its projects[].name)
          case "$HUNT_PROJECT" in
            desktop|mobile-portrait|narrow|android|mobile-landscape|tablet|wide) ;;
            *) echo "::error::not a project of playwright.config.js: $HUNT_PROJECT"; exit 1 ;;
          esac

      - name: Download the PWA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hunt-pwa
          path: dist/pwa

      - name: Download the PWA generator
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hunt-gen-pwa
          path: dist/debug

      - name: Make the generator runnable
        run: chmod +x dist/debug/gen-pwa

      # Node's packages and the Playwright browsers, as the e2e groups get them (pwa's action, quire#637)
      - name: Set up Node.js and Playwright
        uses: bats-lang/pwa/.github/actions/e2e-setup@ea8a14aaaffbca00c6a740cc481e51f7d594e07d # pwa main after #124 (no release tag)
        with:
          playwright-minimum: "1.58"

      # gdb, eu-stack and libc6-dbg for the stall capture (quire#575), the same step as the e2e jobs
      # (.github/actions/stall-tools; a stopgap until bats-lang/pwa#109). Never fails the shard.
      - name: Install gdb
        continue-on-error: true
        uses: ./.github/actions/stall-tools

      # The shard: the specs repeated, on one project, through gen-pwa test. Its run is named
      # `hunt` by the timings directory, so outputs (test-results/hunt/, each stall capture) are
      # kept apart from any other run
      - name: Repeat the specs
        id: repeat
        run: |
          mkdir -p "$RUNNER_TEMP/hunt-timings"
          specs=""
          for spec in $HUNT_SPECS; do specs="$specs e2e/$spec"; done
          ./dist/debug/gen-pwa test --timings "$RUNNER_TEMP/hunt-timings" -- \
            --project="$HUNT_PROJECT" --repeat-each="$HUNT_REPEAT" --max-failures=1 \
            --reporter=list,json $specs
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Say what the shard found
        if: always()
        run: |
          captures=$(find test-results -name 'stall-capture-*.json' 2>/dev/null | sort)
          count=$(printf '%s' "$captures" | grep -c . || true)
          {
            echo "## Hunt shard ${{ matrix.shard }}: ${HUNT_PROJECT}, repeat ${HUNT_REPEAT}"
            echo ""
            echo "Specs: ${HUNT_SPECS}"
            echo ""
            echo "Repeat step outcome: ${{ steps.repeat.outcome }}"
            echo ""
            if [ "$count" -gt 0 ]; then
              echo "**A stall capture arrived** ($count). The spec files hold no deliberate freeze, so each one is a real page that did not answer:"
              printf '%s\n' "$captures" | while read -r file; do echo "- $file"; done
            else
              echo "No stall capture in this shard."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stall captures and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hunt-captures-${{ matrix.shard }}
          path: |
            test-results/**/stall-capture-*.json
            test-results/**/runner-load-*.json
            test-results/**/page-timing-*.json
            test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 30

      # The core of a renderer that froze (e2e/stall-capture.js), kept 7 days as check.yml keeps
      # its cores: a core holds the renderer's memory (the e2e fixtures' pages and books, never a user's)
      - name: Upload stall cores
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hunt-stall-cores-${{ matrix.shard }}
          path: test-results/**/stall-core-*.core.gz
          if-no-files-found: ignore
          retention-days: 7
