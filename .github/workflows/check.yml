name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The relock workflow starts it on its relock/<date> branch: a pull
  # request opened with GITHUB_TOKEN starts no workflow by itself
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ATS2
        run: |
          curl -sL "https://raw.githubusercontent.com/ats-lang/ats-lang.github.io/master/FROZEN000/ATS-Postiats/ATS2-Postiats-int-0.4.2.tgz" -o /tmp/ats2.tgz
          mkdir -p ~/.ats2
          tar -xzf /tmp/ats2.tgz -C ~/.ats2
          cd ~/.ats2/ATS2-Postiats-int-0.4.2
          make -j$(nproc) -C src/CBOOT patsopt
          mkdir -p bin
          cp src/CBOOT/patsopt bin/patsopt
          mkdir -p ~/.bats
          ln -sf ~/.ats2/ATS2-Postiats-int-0.4.2 ~/.bats/ats2

      - name: Install WASM tools
        run: sudo apt-get install -y -q lld

      # The compiler at the commit .github/bats-version pins (#203)
      - name: Read the compiler pin
        id: pins
        run: echo "bats=$(tr -d '[:space:]' < .github/bats-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout bats compiler
        uses: actions/checkout@v4
        with:
          repository: bats-lang/bats
          ref: ${{ steps.pins.outputs.bats }}
          path: bats-src

      - name: Build bats from checked-in bootstrap C
        run: |
          cp -R bats-src/bootstrap/c ~/bats-c
          make -j$(nproc) -C ~/bats-c PATSHOME=$HOME/.ats2/ATS2-Postiats-int-0.4.2 debug/bats
          mkdir -p ~/bats-bin
          cp ~/bats-c/debug/bats ~/bats-bin/bats
          rm -rf bats-src

      - name: Setup
        run: |
          sudo cp $HOME/bats-bin/bats /bin/bats
          git clone --depth 1 https://github.com/bats-lang/repository-prototype.git $HOME/repository
          # The packages are the versions the committed bats.lock locks
          # (#203); bats check and build fetch exactly those, and fail on
          # a lock that does not match the project. Only a relock moves
          # them: never this workflow.
          test -f bats.lock || { echo "::error::bats.lock is missing: run 'bats lock --repository <dir>' and commit it"; exit 1; }

      - name: bats check
        run: |
          bats check --repository $HOME/repository

      - name: Static tests
        run: tests/static/run.sh $HOME/repository

      - name: Build the app and the PWA generator
        run: bats build --repository $HOME/repository

      - name: Generate PWA
        run: ./dist/debug/gen-pwa

      # The OAuth clients it signs in with: public IDs, from the
      # repository's variables (a secret of the same name works too)
      - name: Sync clients
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
        run: scripts/sync-clients.sh dist/pwa

      - name: Verify PWA output
        run: |
          test -f dist/pwa/index.html
          test -f dist/pwa/bridge.js
          test -f dist/pwa/app.wasm
          test -x dist/android/build-android.sh
          grep -q '"appId": "dev.middlefield.quire"' dist/android/capacitor.config.json
          # the icons the manifest names, and the EPUBs the app opens
          test -s dist/pwa/icon-192.png
          test -s dist/pwa/icon-512.png
          grep -q 'android:mimeType="application/epub+zip"' dist/android/intent-filters.xml
          echo "PWA verification passed"

      # A book for the Android smoke test to share with the app
      - name: Make the book to share
        run: >-
          node -e "import('./e2e/create-epub.js').then(m => require('fs').writeFileSync('dist/android/smoke-share.epub',
          m.createEpub({ title: 'Shared With Quire', author: 'Smoke Test', chapters: 2, storeChapters: true })))"

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: quire-android
          path: |
            dist/android
            dist/pwa
          retention-days: 1

      # The home page beside the app, as deploy.yml publishes it, for the
      # e2e test that the service worker leaves it to the network. Added
      # after the Android project is uploaded, which never holds it
      - name: Add the home page
        run: cp -R homepage dist/pwa/homepage

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run WASM smoke tests
        run: npx vitest run

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run e2e tests
        run: npx playwright test

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/
          retention-days: 14

  # The Android app (AAB and APK), built by the pwa package's workflow and
  # signed with this repository's secrets; see ANDROID.md. Every run, a
  # branch's or a pull request's too, builds and signs them the same way
  # and checks that both are signed with the release key; only a push to
  # main uploads them as downloadable artifacts.
  android:
    needs: check
    # Pinned by commit; the relock workflow moves it (#203)
    uses: bats-lang/pwa/.github/workflows/android.yml@8827ba2a28e0ea8292c868097fd7e3654b620f21
    secrets: inherit
    with:
      artifact: quire-android
      project-dir: android
      require-signed: true
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Above the version code (1) of the build uploaded before this workflow
      version-code-offset: 1
      # Run it on an emulator until the library's button, which the wasm
      # renders (the static page shows only a spinner), is on the screen
      smoke-test-text: Import EPUB
      # then share a book with it, as another app would, until its title
      # is in the library
      smoke-share-file: android/smoke-share.epub
      smoke-share-type: application/epub+zip
      smoke-share-text: Shared With Quire
