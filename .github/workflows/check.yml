name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ATS2
        run: |
          curl -sL "https://raw.githubusercontent.com/ats-lang/ats-lang.github.io/master/FROZEN000/ATS-Postiats/ATS2-Postiats-int-0.4.2.tgz" -o /tmp/ats2.tgz
          mkdir -p ~/.ats2
          tar -xzf /tmp/ats2.tgz -C ~/.ats2
          cd ~/.ats2/ATS2-Postiats-int-0.4.2
          make -j$(nproc) -C src/CBOOT patsopt
          mkdir -p bin
          cp src/CBOOT/patsopt bin/patsopt
          mkdir -p ~/.bats
          ln -sf ~/.ats2/ATS2-Postiats-int-0.4.2 ~/.bats/ats2

      - name: Install WASM tools
        run: sudo apt-get install -y -q lld

      - name: Checkout bats compiler
        uses: actions/checkout@v4
        with:
          repository: bats-lang/bats
          ref: main
          path: bats-src

      - name: Build bats from checked-in bootstrap C
        run: |
          cp -R bats-src/bootstrap/c ~/bats-c
          make -j$(nproc) -C ~/bats-c PATSHOME=$HOME/.ats2/ATS2-Postiats-int-0.4.2 debug/bats
          mkdir -p ~/bats-bin
          cp ~/bats-c/debug/bats ~/bats-bin/bats
          rm -rf bats-src

      - name: Setup
        run: |
          sudo cp $HOME/bats-bin/bats /bin/bats
          git clone https://github.com/bats-lang/repository-prototype.git $HOME/repository

      - name: bats check
        run: |
          bats lock --repository $HOME/repository
          bats check --repository $HOME/repository

      - name: Build WASM
        run: bats build --only wasm --repository $HOME/repository

      - name: Build PWA generator
        run: bats build --only native --repository $HOME/repository

      - name: Generate PWA
        run: |
          mkdir -p dist/pwa
          dist/debug/gen-pwa

      - name: Verify PWA output
        run: |
          test -f dist/pwa/index.html
          test -f dist/pwa/bridge.js
          test -f dist/pwa/app.wasm
          test -x dist/android/build-android.sh
          grep -q '"appId": "dev.middlefield.quire"' dist/android/capacitor.config.json
          # the icons the manifest names, and the EPUBs the app opens
          test -s dist/pwa/icon-192.png
          test -s dist/pwa/icon-512.png
          grep -q 'android:mimeType="application/epub+zip"' dist/android/intent-filters.xml
          echo "PWA verification passed"

      # A book for the Android smoke test to share with the app
      - name: Make the book to share
        run: >-
          node -e "import('./e2e/create-epub.js').then(m => require('fs').writeFileSync('dist/android/smoke-share.epub',
          m.createEpub({ title: 'Shared With Quire', author: 'Smoke Test', chapters: 2, storeChapters: true })))"

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: quire-android
          path: |
            dist/android
            dist/pwa
          retention-days: 1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run WASM smoke tests
        run: npx vitest run

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run e2e tests
        run: npx playwright test

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/
          retention-days: 14

  # The Android app (AAB and APK), built by the pwa package's workflow and
  # signed with this repository's secrets; see ANDROID.md
  android:
    needs: check
    uses: bats-lang/pwa/.github/workflows/android.yml@main
    secrets: inherit
    with:
      artifact: quire-android
      project-dir: android
      # Above the version code (1) of the build uploaded before this workflow
      version-code-offset: 1
      # Run it on an emulator until the library's button, which the wasm
      # renders (the static page shows only a spinner), is on the screen
      smoke-test-text: Import EPUB
      # then share a book with it, as another app would, until its title
      # is in the library
      smoke-share-file: android/smoke-share.epub
      smoke-share-type: application/epub+zip
      smoke-share-text: Shared With Quire
