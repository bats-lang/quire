name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A merge queue runs the check on its own merge group
  merge_group:
  # The relock workflow starts it on its relock/<date> branch: a pull
  # request opened with GITHUB_TOKEN starts no workflow by itself
  workflow_dispatch:

jobs:
  # The groups the tests run in, side by side (tests/groups.json): every
  # e2e spec and every static test in exactly one, or this fails
  plan:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.groups.outputs.e2e }}
      static: ${{ steps.groups.outputs.static }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every test in exactly one group
        id: groups
        run: scripts/ci-groups.py matrix

      # The release to Play's internal track (play-internal, below) runs on
      # main only; its script is checked here against a stub of Play
      - name: The Play release script
        run: tests/play-release/run.sh

  # The app and the PWA, built once: the Android project and the e2e
  # groups take them from here (the quire-android artifact)
  build:
    runs-on: ubuntu-latest
    steps:
      # Two commits deep: a pull request's checkout is the merge, and its
      # own head (its second parent) is what the version names (#219)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Set up bats
        uses: ./.github/actions/setup-bats
        with:
          commit: ${{ github.event.pull_request.head.sha || github.sha }}

      # A pull request starts from the newest build of the same toolchain
      # (main's, or its own earlier push's); main builds cold (#460)
      - name: Restore the compiler cache
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/build-cache
        with:
          mode: restore
          name: build
          path: build

      - name: Build the app and the PWA generator
        run: bats build --repository $HOME/repository

      - name: Generate PWA
        run: ./dist/debug/gen-pwa

      # The OAuth clients it signs in with: public IDs, committed in
      # scripts/sync-clients.env
      - name: Sync clients
        run: scripts/sync-clients.sh dist/pwa

      # The same commit always gives the same version, whatever the clock
      # or time zone, and the Android project carries it (#219)
      - name: Check the version
        env:
          QUIRE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: tests/version/same.sh

      - name: Verify PWA output
        run: |
          test -f dist/pwa/index.html
          test -f dist/pwa/bridge.js
          test -f dist/pwa/app.wasm
          test -x dist/android/build-android.sh
          grep -q '"appId": "dev.middlefield.quire"' dist/android/capacitor.config.json
          # the icons the manifest names, and the EPUBs the app opens
          test -s dist/pwa/icon-192.png
          test -s dist/pwa/icon-512.png
          grep -q 'android:mimeType="application/epub+zip"' dist/android/intent-filters.xml
          echo "PWA verification passed"

      # A book for the Android smoke test to open the app with
      - name: Make the book to share
        run: >-
          node -e "import('./e2e/create-epub.js').then(m => require('fs').writeFileSync('dist/android/smoke-share.epub',
          m.createEpub({ title: 'Shared With Quire', author: 'Smoke Test', chapters: 2, storeChapters: true })))"

      # The PWA and the Android project, for the Android jobs and the e2e
      # groups (which add the home page themselves: the Android project
      # never holds it)
      - name: Upload Android project
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quire-android
          path: |
            dist/android
            dist/pwa
          retention-days: 1

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run WASM smoke tests
        run: npx vitest run

      # The record codec, natively: the checksum's check value, the edge of
      # 32 bits, damage to every byte, fuzz (#354)
      - name: Codec tests
        run: tests/codec/run.sh $HOME/repository

      # Only after everything above passed: a cache holds no failed build
      - name: Save the compiler cache
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: ./.github/actions/build-cache
        with:
          mode: save
          name: build
          path: build

  # The static tests (tests/static/run.sh): bats check of the app, the
  # checkers, and the fixtures, each put into the app checked whole, so
  # each checks only its module again; in groups side by side, each
  # checking the app first
  static:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.static) }}
    name: static (${{ matrix.group }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Set up bats
        uses: ./.github/actions/setup-bats
        with:
          commit: ${{ github.event.pull_request.head.sha || github.sha }}

      # The app's check is kept in a directory of a fixed name (run.sh
      # checks at the same path in every job, #460)
      - name: Restore the compiler cache
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/build-cache
        with:
          mode: restore
          name: static
          path: ${{ runner.temp }}/quire-static/app/build

      - name: Static tests
        env:
          QUIRE_STATIC_WORK: ${{ runner.temp }}/quire-static
        run: tests/static/run.sh $HOME/repository $(scripts/ci-groups.py members static ${{ matrix.group }})

      - name: Save the compiler cache
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: ./.github/actions/build-cache
        with:
          mode: save
          name: static
          path: ${{ runner.temp }}/quire-static/app/build

  # The e2e suite, in groups by area side by side, each on the PWA built
  # once (quire-android)
  e2e:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.e2e) }}
    name: e2e (${{ matrix.group }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the PWA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quire-android
          path: dist

      # The home page beside the app, as deploy.yml publishes it, for the
      # e2e test that the service worker leaves it to the network
      - name: Add the home page
        run: cp -R homepage dist/pwa/homepage

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install chromium

      # A font with Japanese characters: the vertical book's shots are
      # empty boxes without one (quire#359; vertical.spec.js checks it)
      - name: Install a CJK font
        run: sudo apt-get install -y -q fonts-noto-cjk

      # The checker of the books the specs read (epubcheck.spec.js),
      # pinned by its version and the archive's SHA-256
      - name: Install epubcheck
        run: |
          curl -fsSL -o "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          echo "0532f6291faa2bb729dd253f958868a2a57dbd2c32f881a97c7c980c5940309e  $RUNNER_TEMP/epubcheck.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          echo "EPUBCHECK_JAR=$RUNNER_TEMP/epubcheck-5.2.1/epubcheck.jar" >> "$GITHUB_ENV"

      # Each spec of the group, and only those: the filters must name
      # exactly as many files as the group lists
      - name: Run e2e tests
        run: |
          specs=$(scripts/ci-groups.py members e2e ${{ matrix.group }})
          listed=$(npx playwright test --list $specs | tail -1)
          echo "$listed"
          echo "$listed" | grep -q " in $(echo "$specs" | wc -l) files$" || { echo "::error::the group's filters do not name exactly its $(echo "$specs" | wc -l) specs"; exit 1; }
          npx playwright test --reporter=list,html,json $specs
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/e2e-timings.json

      # Each test's time per project and spec (#461), kept for every run
      # so the groups are balanced by measurement, not guessing: sum
      # `duration` of the report's tests by spec file (tests/groups.json)
      - name: Upload the spec timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-timings-${{ matrix.group }}
          path: ${{ runner.temp }}/e2e-timings.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-report-${{ matrix.group }}
          path: playwright-report/
          retention-days: 14

      # What a page that stopped answering was doing (#244, #254): also
      # in the screenshots, apart here so it is found at once
      - name: Upload stall captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-stall-captures-${{ matrix.group }}
          path: test-results/**/stall-capture-*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-screenshots-${{ matrix.group }}
          path: test-results/
          retention-days: 14

  # The one check main's branch protection requires: every group passed
  # (a group skipped or cancelled is not a pass)
  check:
    if: always()
    needs: [plan, build, static, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every group passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "plan, build, static, e2e: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a job this check needs ended $result"; exit 1; }
          done

  # The Android app (AAB and APK), built by the pwa package's workflow and
  # signed with this repository's secrets; see ANDROID.md. Every run, a
  # branch's or a pull request's too, builds and signs them the same way
  # and checks that both are signed with the release key; only a push to
  # main uploads them as downloadable artifacts.
  android:
    needs: build
    # Pinned by commit; the relock workflow moves it (#203)
    uses: bats-lang/pwa/.github/workflows/android.yml@bc1a92fea5bc2e4bce0a5a9636ee4e5fd68ab9bd
    secrets: inherit
    with:
      artifact: quire-android
      project-dir: android
      require-signed: true
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Above the version code (1) of the build uploaded before this workflow
      version-code-offset: 1
      # Run it on an emulator until the library's button, which the wasm
      # renders (the static page shows only a spinner), is on the screen
      smoke-test-text: Import EPUB
      # then start it anew with a book (VIEW), as a file manager opens
      # it, until its title is in the library; turn and recreate it, and
      # open and share the book while it is open (VIEW, SEND): each
      # intent's book handed to the page once (#247)
      smoke-share-file: android/smoke-share.epub
      smoke-share-type: application/epub+zip
      smoke-share-text: Shared With Quire

  # Every push to main that passed the whole check (the e2e groups and the
  # Android build and smoke test) goes to Google Play's internal testing
  # track (#308): the AAB this run built and signed, its versionName and
  # versionCode the commit's (scripts/version.sh), the commit's subject as
  # its release notes. Production stays a promotion made in the Play
  # Console (ANDROID.md). It signs in by Workload Identity Federation
  # (scripts/play-release.env): no key is stored, and Google admits only
  # a push to main of this repository, so no other run can release.
  play-internal:
    needs: [check, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One release at a time: two edits committed together would conflict
    concurrency:
      group: play-internal
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the AAB
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-aab
          path: release-aab

      - name: Read the sign-in
        id: play
        run: sed -n 's/^\(PLAY_[A-Z_]*\)=\(.*\)$/\1=\2/p' scripts/play-release.env >> "$GITHUB_OUTPUT"

      - name: Sign in to Google Play
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.play.outputs.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ steps.play.outputs.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Release to internal testing
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          PLAY_PACKAGE: ${{ steps.play.outputs.PLAY_PACKAGE }}
        run: |
          set -- release-aab/*.aab
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "::error::release-aab holds no single AAB: $*"; exit 1; }
          # The commit's subject (a pull request's title and number), cut
          # to Play's 500 characters at a whole character
          git log -1 --format=%s | python3 -c 'import sys; sys.stdout.write(sys.stdin.read().strip()[:500])' > "$RUNNER_TEMP/notes"
          scripts/play-release.sh "$1" "$RUNNER_TEMP/notes"
