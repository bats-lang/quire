name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A merge queue runs the check on its own merge group, and says when it
  # destroys one (a rebuilt group, an entry removed): `destroyed` is
  # undocumented by GitHub but delivered (community discussion 137976, and
  # Chapel's workflow cancels superseded runs by it). It only cancels the
  # group's run, below; its own run does nothing (#586)
  merge_group:
    types: [checks_requested, destroyed]
  # The relock workflow starts it on its relock/<date> branch: a pull
  # request opened with GITHUB_TOKEN starts no workflow by itself
  workflow_dispatch:
  # A check of main from nothing every night: the pull requests' and the
  # queue's runs restore the compiler's cache, and a push to main builds cold,
  # so this is the check that does not depend on any cache, with the toolchain
  # (runner image, packages) of the day (#586)
  schedule:
    - cron: '47 3 * * *'

# A push to a pull request cancels the run for its earlier head (#586): the
# queue's jobs are not left behind jobs for stale heads. A merge group's run is
# cancelled only by its own `destroyed` event: GitHub rebuilds the groups
# behind an entry that is removed and leaves the old groups' runs queued
# (six stale runs held the pool on 2026-10-15). A group's runs are keyed on
# its ref (gh-readonly-queue/main/pr-N-<sha>, the same for checks_requested
# and destroyed), so a destroyed run joins the group of the run it ends,
# cancels it, and does nothing itself (every job below is skipped for it).
# No other run is cancelled: push and dispatch runs are keyed on their own
# sha. A cancelled run's `check` belongs to a head or group that is gone; the
# required status of the live one is its own run's.
concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'merge_group' && github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'merge_group' && github.event.action == 'destroyed') }}

jobs:
  # The groups the tests run in, side by side (tests/groups.json): every
  # e2e spec and every static test in exactly one, or this fails. And what
  # each of them has to run for this change (#619): decided here, once, from
  # the pull request's own diff, so the reason of each skip is in one place
  plan:
    if: github.event.action != 'destroyed'
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.groups.outputs.e2e }}
      static: ${{ steps.groups.outputs.static }}
      e2e_run: ${{ steps.scope.outputs.e2e_run }}
      static_run: ${{ steps.scope.outputs.static_run }}
    steps:
      # Two commits deep: a pull request's checkout is the merge, and its
      # first parent is the base the change is compared with
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Every test in exactly one group
        id: groups
        run: scripts/ci-groups.py matrix

      # A pull request runs the groups its change can affect and shows the
      # rest unaffected (scripts/affected.py: a path it does not know selects
      # everything). Every other run is whole: a push to main and the nightly
      # run are the cold check, and the merge queue's group, which has a base
      # too, runs every group (the mutation groups keep their own rule, which
      # takes the group's base)
      - name: What this run has to run
        id: scope
        run: |
          base=none
          full=
          case "${{ github.event_name }}" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            merge_group) base=$(git rev-parse HEAD^1); full=full ;;
          esac
          scripts/ci-groups.py plan $base $full

  # The app and the PWA, built once: the Android project and the e2e
  # groups take them from here (the quire-android artifact)
  build:
    if: github.event.action != 'destroyed'
    runs-on: ubuntu-latest
    steps:
      # Two commits deep: a pull request's checkout is the merge, and its
      # own head (its second parent) is what the version names (#219)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Set up bats
        uses: bats-lang/bats/.github/actions/setup@cf45c87611a9337b9bb28e2543dcb96dcd98639e # the setup action (bats#280)

      # A pull request and the merge queue's group start from the newest
      # build of the same toolchain (main's, or the pull request's own earlier
      # push); a push to main and the nightly run build cold (#460, #586)
      - name: Restore the compiler cache
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: ./.github/actions/build-cache
        with:
          mode: restore
          name: build
          path: build

      - name: Build the app and the PWA generator
        run: bats build

      - name: Generate PWA
        run: ./dist/debug/gen-pwa

      # The OAuth clients it signs in with: public IDs, committed in
      # scripts/sync-clients.env
      - name: Sync clients
        run: scripts/sync-clients.sh dist/pwa

      # The same commit always gives the same version, whatever the clock
      # or time zone, and the Android project carries it (#219)
      - name: Check the version
        run: tests/version/same.sh

      - name: Verify PWA output
        run: |
          test -f dist/pwa/index.html
          test -f dist/pwa/bridge.js
          test -f dist/pwa/app.wasm
          test -x dist/android/build-android.sh
          grep -q '"appId": "dev.middlefield.quire"' dist/android/capacitor.config.json
          # the icons the manifest names, and the EPUBs the app opens
          test -s dist/pwa/icon-192.png
          test -s dist/pwa/icon-512.png
          grep -q 'android:mimeType="application/epub+zip"' dist/android/intent-filters.xml
          echo "PWA verification passed"

      # A book for the Android smoke test to open the app with
      - name: Make the book to share
        run: >-
          node -e "import('./e2e/create-epub.js').then(m => require('fs').writeFileSync('dist/android/smoke-share.epub',
          m.createEpub({ title: 'Shared With Quire', author: 'Smoke Test', chapters: 2, storeChapters: true })))"

      # The PWA and the Android project, for the Android jobs and the e2e
      # groups (which add the home page themselves: the Android project
      # never holds it)
      - name: Upload Android project
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quire-android
          path: |
            dist/android
            dist/pwa
          retention-days: 1

      # The generator, whose `test` runs the e2e groups' suites (#499)
      - name: Upload the PWA generator
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quire-gen-pwa
          path: dist/debug/gen-pwa
          retention-days: 1

      # Node's packages, retried and cached, and the Playwright browsers:
      # pwa's action (quire#637). The WASM smoke tests need no browsers, which
      # are restored from the cache here
      - name: Set up Node.js and Playwright
        uses: bats-lang/pwa/.github/actions/e2e-setup@e2d98d401f06abdccebad8a53f0be1938ab43b8a
        with:
          playwright-minimum: "1.58"

      - name: Run WASM smoke tests
        run: npx vitest run

      # The record codec, natively: the checksum's check value, the edge of
      # 32 bits, damage to every byte, fuzz (#354)
      - name: Codec tests
        run: tests/codec/run.sh $BATS_REPOSITORY

      # The CSS font-size reader, natively: values and units, declaration
      # blocks, selectors, whole style sheets and fuzz (#431)
      - name: CSS size tests
        run: tests/css-size/run.sh $BATS_REPOSITORY

      # Only after everything above passed: a cache holds no failed build
      - name: Save the compiler cache
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: ./.github/actions/build-cache
        with:
          mode: save
          name: build
          path: build

  # The static tests (tests/static/run.sh): bats check of the app, the
  # checkers, and the fixtures, each put into the app checked whole, so
  # each checks only its module again; in groups side by side, each
  # checking the app first
  static:
    needs: plan
    runs-on: ubuntu-latest
    # a mutation group of a change to crc.bats is the longest (CLAUDE.md, #594)
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.static) }}
    name: static (${{ matrix.group }})
    # What the plan selected of this group's members (#619): none ends the job
    # after its first step, and only `checkers` (python) needs no compiler
    env:
      GROUP_MEMBERS: ${{ fromJSON(needs.plan.outputs.static_run)[matrix.group].members }}
      GROUP_BATS: ${{ fromJSON(needs.plan.outputs.static_run)[matrix.group].bats && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.GROUP_MEMBERS != ''
        with:
          fetch-depth: 2

      # The groups of mutation members (#594) run only the lemmas the pull
      # request's change can have made vacuous, and nothing when it touches
      # no proof (the plan selects no member then); the other groups run what
      # the plan selected. The scheduled run (mutation.yml) has all of them.
      - name: What this group compares with
        id: scope
        if: env.GROUP_MEMBERS != ''
        run: |
          base=none
          case "${{ github.event_name }}" in
            pull_request|merge_group) base=$(git rev-parse HEAD^1) ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Set up bats
        if: env.GROUP_BATS == 'yes'
        uses: bats-lang/bats/.github/actions/setup@cf45c87611a9337b9bb28e2543dcb96dcd98639e # the setup action (bats#280)

      # The app's check is kept in a directory of a fixed name (run.sh
      # checks at the same path in every job, #460)
      - name: Restore the compiler cache
        if: env.GROUP_BATS == 'yes' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        uses: ./.github/actions/build-cache
        with:
          mode: restore
          name: static
          path: ${{ runner.temp }}/quire-static/app/build

      # (no BATS_REPOSITORY without the compiler: the checkers read none)
      - name: Static tests
        if: env.GROUP_MEMBERS != ''
        env:
          QUIRE_STATIC_WORK: ${{ runner.temp }}/quire-static
          QUIRE_MUTATION_BASE: ${{ steps.scope.outputs.base != 'none' && steps.scope.outputs.base || '' }}
        run: tests/static/run.sh "${BATS_REPOSITORY:-none}" $GROUP_MEMBERS

      - name: Save the compiler cache
        if: env.GROUP_BATS == 'yes' && (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: ./.github/actions/build-cache
        with:
          mode: save
          name: static
          path: ${{ runner.temp }}/quire-static/app/build

  # The e2e suite, in groups by area side by side, each on the PWA built
  # once (quire-android)
  e2e:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.e2e) }}
    name: e2e (${{ matrix.group }})
    # Whether the plan selected a spec of this group (#619); if not, the job
    # ends here: every step below is skipped and the job still passes, as the
    # change was shown not to reach any of the group's specs
    env:
      GROUP_RUN: ${{ fromJSON(needs.plan.outputs.e2e_run)[matrix.group] && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.GROUP_RUN == 'yes'

      - name: Download the PWA
        if: env.GROUP_RUN == 'yes'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quire-android
          path: dist

      # gen-pwa, for `gen-pwa test` (an artifact keeps no file mode)
      - name: Download the PWA generator
        if: env.GROUP_RUN == 'yes'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quire-gen-pwa
          path: dist/debug

      - name: Make the generator runnable
        if: env.GROUP_RUN == 'yes'
        run: chmod +x dist/debug/gen-pwa

      # The home page beside the app, as deploy.yml publishes it, for the
      # e2e test that the service worker leaves it to the network
      - name: Add the home page
        if: env.GROUP_RUN == 'yes'
        run: cp -R homepage dist/pwa/homepage

      # Node's packages, retried and cached, and the Playwright browsers in
      # one directory (PLAYWRIGHT_BROWSERS_PATH): pwa's action (quire#637).
      # 1.58 is the least Playwright the suite may run on (CLAUDE.md, "The e2e
      # suite needs Playwright 1.58 or later")
      - name: Set up Node.js and Playwright
        if: env.GROUP_RUN == 'yes'
        uses: bats-lang/pwa/.github/actions/e2e-setup@e2d98d401f06abdccebad8a53f0be1938ab43b8a
        with:
          playwright-minimum: "1.58"

      # A font with Japanese characters: the vertical book's shots are
      # empty boxes without one (quire#359; vertical.spec.js checks it)
      - name: Install a CJK font
        if: env.GROUP_RUN == 'yes'
        run: sudo apt-get install -y -q fonts-noto-cjk

      # gdb, for the stall capture's native stacks of a frozen renderer
      # (e2e/stall-capture.js, quire#575 and #591). A STOPGAP: pwa's e2e-setup
      # action should install it and keep the runner's passwordless sudo
      # (bats-lang/pwa#109); this step goes when that lands. A diagnostic for a
      # rare freeze must not turn a job red, so the index is updated, the install
      # retried, and a failure goes on (the capture uses gdb only if it is there;
      # only the stall-capture spec fails, loudly, when it is not).
      - name: Install gdb
        if: env.GROUP_RUN == 'yes'
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -q && sudo apt-get install -y -q gdb && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      # The checker of the books the specs read (epubcheck.spec.js),
      # pinned by its version and the archive's SHA-256
      - name: Install epubcheck
        if: env.GROUP_RUN == 'yes'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          echo "0532f6291faa2bb729dd253f958868a2a57dbd2c32f881a97c7c980c5940309e  $RUNNER_TEMP/epubcheck.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          echo "EPUBCHECK_JAR=$RUNNER_TEMP/epubcheck-5.2.1/epubcheck.jar" >> "$GITHUB_ENV"

      # Each spec of the group, and only those: the filters must name
      # exactly as many files as the group lists
      - name: Run e2e tests
        if: env.GROUP_RUN == 'yes'
        run: |
          specs=$(scripts/ci-groups.py members e2e ${{ matrix.group }})
          listed=$(npx playwright test --list $specs | tail -1)
          echo "$listed"
          echo "$listed" | grep -q " in $(echo "$specs" | wc -l) files$" || { echo "::error::the group's filters do not name exactly its $(echo "$specs" | wc -l) specs"; exit 1; }
          # through gen-pwa test (pwa#82, #499): dist/pwa served at a port
          # the kernel picks, the tests that measure time (tagged @serial)
          # alone on one worker first, then the others; each run's JSON
          # report in the timings directory (serial.json, parallel.json)
          mkdir -p "$RUNNER_TEMP/e2e-timings"
          ./dist/debug/gen-pwa test --timings "$RUNNER_TEMP/e2e-timings" -- --reporter=list,html,json $specs
        env:
          PLAYWRIGHT_HTML_OPEN: never

      # Each test's time per project and spec (#461), kept for every run
      # so the groups are balanced by measurement, not guessing: sum
      # `duration` of the report's tests by spec file (tests/groups.json)
      - name: Upload the spec timings
        if: always() && env.GROUP_RUN == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-timings-${{ matrix.group }}
          path: ${{ runner.temp }}/e2e-timings/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the Playwright report
        if: failure() && env.GROUP_RUN == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-report-${{ matrix.group }}
          path: playwright-report/
          retention-days: 14

      # What a page that stopped answering was doing (#244, #254): also
      # in the screenshots, apart here so it is found at once
      - name: Upload stall captures
        if: always() && env.GROUP_RUN == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-stall-captures-${{ matrix.group }}
          path: test-results/**/stall-capture-*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test screenshots
        if: always() && env.GROUP_RUN == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-screenshots-${{ matrix.group }}
          path: test-results/
          retention-days: 14

  # The one check main's branch protection requires: every group passed
  # (a group skipped or cancelled is not a pass). A group the plan showed
  # unaffected (#619) is a job that ran and ended after its first step, so it
  # passes as itself, and the plan's selection is printed here, beside the
  # results, with the reason of each path in the plan job's summary
  check:
    if: always() && github.event.action != 'destroyed'
    needs: [plan, build, static, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every group passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          E2E_RUN: ${{ needs.plan.outputs.e2e_run }}
          STATIC_RUN: ${{ needs.plan.outputs.static_run }}
        run: |
          echo "plan, build, static, e2e: $RESULTS"
          echo "e2e groups run (false: shown unaffected by the change): $E2E_RUN"
          echo "static members run, by group: $STATIC_RUN"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a job this check needs ended $result"; exit 1; }
          done

  # The Android app (AAB and APK), built by the pwa package's workflow and
  # signed with this repository's secrets; see ANDROID.md. Every run, a
  # branch's or a pull request's too, builds and signs them the same way
  # and checks that both are signed with the release key; only a push to
  # main uploads them as downloadable artifacts.
  android:
    needs: build
    # Pinned by commit; the relock workflow moves it (#203)
    uses: bats-lang/pwa/.github/workflows/android.yml@bc1a92fea5bc2e4bce0a5a9636ee4e5fd68ab9bd
    secrets: inherit
    with:
      artifact: quire-android
      project-dir: android
      require-signed: true
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Above the version code (1) of the build uploaded before this workflow
      version-code-offset: 1
      # Run it on an emulator until the library's button, which the wasm
      # renders (the static page shows only a spinner), is on the screen
      smoke-test-text: Import EPUB
      # then start it anew with a book (VIEW), as a file manager opens
      # it, until its title is in the library; turn and recreate it, and
      # open and share the book while it is open (VIEW, SEND): each
      # intent's book handed to the page once (#247)
      smoke-share-file: android/smoke-share.epub
      smoke-share-type: application/epub+zip
      smoke-share-text: Shared With Quire

  # Every push to main that passed the whole check (the e2e groups and the
  # Android build and smoke test) goes to Google Play's internal testing
  # track (#308): the AAB this run built and signed, its versionName and
  # versionCode the commit's (src/version.bats), the commit's subject as
  # its release notes. Production stays a promotion made in the Play
  # Console (ANDROID.md). The release is pwa's reusable workflow (pwa#90,
  # moved there by quire#623), called by commit like android.yml:
  # pwa-ref is the same commit as the pin (a reusable workflow cannot read
  # the commit it was called at). It signs in by Workload Identity
  # Federation, so no key is stored; the names below are public, and
  # Google admits only a push to main of this repository (ANDROID.md)
  play-internal:
    needs: [check, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: bats-lang/pwa/.github/workflows/play-release.yml@ae21e1cd63f59f4f190b5f900151e16a3cd17fc8
    permissions:
      contents: read
      id-token: write
    with:
      pwa-ref: ae21e1cd63f59f4f190b5f900151e16a3cd17fc8
      package: dev.middlefield.quire
      workload-identity-provider: projects/162611675413/locations/global/workloadIdentityPools/github/providers/quire
      service-account: quire-play-release@spring-duality-395520.iam.gserviceaccount.com
