# Daily: relock quire's packages and move its CI pins to their newest, as
# a pull request that runs check.yml (#203). The work is the generic
# relock-pins.yml in bats-lang/repository-prototype (#269 there), called
# by commit; what is quire's is only what it is given here.
name: relock

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  relock:
    # main of repository-prototype at 3873e58 (after #372): its runners are ubuntu-24.04 (#352 there)
    uses: bats-lang/repository-prototype/.github/workflows/relock-pins.yml@d256b6e3c2f5a580dc8a0039de86ea416358f5ae
    secrets: inherit
    with:
      workflow-pins: |
        bats-lang/pwa/.github/workflows/android.yml
        bats-lang/repository-prototype/.github/workflows/relock-pins.yml
        bats-lang/bats/.github/actions/setup
        bats-lang/repository-prototype/.github/actions/check-aggregate
