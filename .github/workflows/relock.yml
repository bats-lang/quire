# Daily: relock quire's packages and move its CI pins to their newest, as
# a pull request that runs check.yml (#203). The work is the generic
# relock-pins.yml; what is quire's is only what it is given here.
name: relock

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  relock:
    uses: ./.github/workflows/relock-pins.yml
    secrets: inherit
    with:
      workflow-pins: |
        bats-lang/pwa/.github/workflows/android.yml
