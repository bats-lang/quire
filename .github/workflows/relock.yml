# Daily: relock quire's packages and move its CI pins to their newest, as
# a pull request that runs check.yml (#203). The work is the generic
# relock-pins.yml in bats-lang/repository-prototype (#269 there), called
# by commit; what is quire's is only what it is given here.
name: relock

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  relock:
    uses: bats-lang/repository-prototype/.github/workflows/relock-pins.yml@853193b6d48ae85c122a726659d68b2c0896251c
    secrets: inherit
    with:
      workflow-pins: |
        bats-lang/pwa/.github/workflows/android.yml
        bats-lang/repository-prototype/.github/workflows/relock-pins.yml
        bats-lang/bats/.github/actions/setup
