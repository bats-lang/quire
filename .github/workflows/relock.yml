# Daily: relock quire's packages and move its CI pins to their newest, as
# a pull request that runs check.yml (#203). The work is the generic
# relock-pins.yml in bats-lang/repository-prototype (#269 there), called
# by commit; what is quire's is only what it is given here.
name: relock

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  relock:
    # main of repository-prototype at 8365e83: has 11f7260, which stages only the tracked npm and Gradle files (a repository with none failed the staging step, #872)
    uses: bats-lang/repository-prototype/.github/workflows/relock-pins.yml@e0e628e56fbfd10ee3e143c25fc5d3f7c022d100 # repository-prototype main e0e628e
    secrets: inherit
    with:
      # pwa's e2e-setup has no pwa-ref copy of its pin, so the relock moves it whole (#777).
      # play-release.yml is not listed: it is called at its own commit, and only its pwa-ref input follows android.yml (pin-copies below).
      workflow-pins: |
        bats-lang/pwa/.github/workflows/android.yml
        bats-lang/pwa/.github/actions/e2e-setup
        bats-lang/repository-prototype/.github/workflows/relock-pins.yml
        bats-lang/bats/.github/actions/setup
        bats-lang/repository-prototype/.github/actions/check-aggregate
      # check.yml repeats android.yml's commit as pwa-ref, which pwa's android.yml and
      # play-release.yml read (a reusable workflow cannot read its own ref): the relock
      # writes the new commit into every pwa-ref line of the files that call android.yml (#821)
      pin-copies: |
        bats-lang/pwa/.github/workflows/android.yml pwa-ref
