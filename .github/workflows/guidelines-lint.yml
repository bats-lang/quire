name: guidelines-lint

# What agents write beyond the body of a pull request is held to the phrases and the form of
# tests/static/guidelines.py (quire#751): the newest review comment (its verdict, its head, the
# gate's one Reviewed line) and a ticket's text. The result is the commit status
# `guidelines-lint` on the PR's head, so a review with an exit clause shows red beside the
# checks; a ticket gets a comment. The form of the PR body is the shared `text-lint` (the
# template caller, text-lint.yml), which alone writes the status `text-lint` (quire#1047).
#
# STOPGAP (CLAUDE.md, "Pipeline and tooling improvements belong in bats or pwa"): a second app
# would copy this workflow, so its move is bats-lang/bats#431 and this file is deleted when
# that lands. Waiting would cost more than the move: the same mistakes came back every session.
# The avenue exhausted for non-bats code (quire#646): bats has no command that reads the text of
# a comment or of a markdown file, and bats-lang/bats#431 (with bats#435 for the sweep tools) is
# the ticket that adds one; a workflow that calls it replaces this file. The file is allowlisted
# by its hash in repository-prototype's tools/pin-audit/allowlist.txt (repository-prototype#575).
#
# Safe on issue_comment and issues: both run the script as the default branch has it, check out
# nothing of the PR and pass the text to the script in the event payload only, never through a
# shell, so no code of the PR runs (the same reasoning as bridge's review gate).
# It is not a required check: it reports.
on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  group: guidelines-lint-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  lint:
    # a comment of the workflow's own bot is the lint's answer, not a text to lint
    if: github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint the text of the event
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/static/guidelines.py --github
