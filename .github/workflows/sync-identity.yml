# What the sync services need registered for Quire (bats-lang/quire#184):
# the Android signing key's fingerprints, computed from the keystore
# secrets ANDROID.md describes, and whether each sync client ID is set.
# Fingerprints are public (they are in every signed APK); the keystore and
# its passwords never leave the runner, and no ID's value is printed.
name: sync identity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sync-identity.yml]

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - name: Signing key fingerprints
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          {
            echo "## Android signing key (upload key)"
            echo
            echo "Package: \`dev.middlefield.quire\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret: no fingerprints." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          listing=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS")
          sha1=$(printf '%s\n' "$listing" | sed -n 's/^[[:space:]]*SHA1: *//p' | head -1)
          sha256=$(printf '%s\n' "$listing" | sed -n 's/^[[:space:]]*SHA256: *//p' | head -1)
          test -n "$sha1" || { echo "::error::No SHA-1 for alias KEY_ALIAS in the keystore"; exit 1; }
          {
            echo "| | |"
            echo "|---|---|"
            echo "| SHA-1 | \`$sha1\` |"
            echo "| SHA-256 | \`$sha256\` |"
            echo
            echo "Register an **Android** OAuth client in Google Cloud for this package and SHA-1."
            echo "Apps installed from Google Play are signed with Play's app signing key instead:"
            echo "its SHA-1 is in Play Console → App integrity, and needs an Android client of its own."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Sync client IDs
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_CLIENT_ID || secrets.GOOGLE_ANDROID_CLIENT_ID }}
          DROPBOX_CLIENT_ID: ${{ vars.DROPBOX_CLIENT_ID || secrets.DROPBOX_CLIENT_ID }}
          YANDEX_CLIENT_ID: ${{ vars.YANDEX_CLIENT_ID || secrets.YANDEX_CLIENT_ID }}
          PLAY_SIGNING_SHA1: ${{ vars.PLAY_SIGNING_SHA1 || secrets.PLAY_SIGNING_SHA1 }}
        run: |
          {
            echo "## Sync client IDs"
            echo
            echo "| Name | |"
            echo "|---|---|"
            for name in GOOGLE_WEB_CLIENT_ID GOOGLE_ANDROID_CLIENT_ID DROPBOX_CLIENT_ID YANDEX_CLIENT_ID PLAY_SIGNING_SHA1; do
              if [ -n "${!name}" ]; then state=set; else state=missing; fi
              echo "| \`$name\` | $state |"
            done
            echo
            echo "Client IDs are public: store them as repository **variables**."
            echo
            echo "## Entries to register"
            echo
            echo "* Google, Web application client: JavaScript origins \`https://bats-lang.github.io\` and \`http://localhost:3737\`; scope \`https://www.googleapis.com/auth/drive.appdata\`."
            echo "* Google, Android client: package \`dev.middlefield.quire\`, the SHA-1 above (and Play's)."
            echo "* Dropbox: redirect URIs \`https://bats-lang.github.io/quire/?oauth=dropbox\`, \`http://localhost:3737/?oauth=dropbox\`, \`quire://oauth/dropbox\`; scopes \`files.content.read\`, \`files.content.write\`; App folder; public clients (PKCE) allowed."
            echo "* Yandex: redirect URIs \`https://bats-lang.github.io/quire/?oauth=yandex\`, \`quire://oauth/yandex\`; Yandex.Disk app folder."
          } >> "$GITHUB_STEP_SUMMARY"
