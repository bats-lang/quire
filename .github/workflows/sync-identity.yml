# What the sync services need registered for Quire (bats-lang/quire#184):
# a check of the Google clients, Play's signing SHA-1 and Dropbox's app
# key committed in scripts/sync-clients.env (#200, #239). The upload key's
# fingerprints are printed, and Play's SHA-1 refused if it is the upload
# key's, by pwa's android.yml in check.yml's android job (pwa#96, quire#623).
# Client IDs are public (they are in every page).
name: sync identity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sync-identity.yml, scripts/sync-clients.env]

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync client IDs
        run: |
          value() { sed -n "s/^$1=//p" scripts/sync-clients.env; }
          web=$(value GOOGLE_WEB_CLIENT_ID)
          android=$(value GOOGLE_ANDROID_CLIENT_ID)
          play=$(value PLAY_SIGNING_SHA1)
          dropbox=$(value DROPBOX_CLIENT_ID)
          for id in "$web" "$android"; do
            printf '%s' "$id" | grep -Eqx '[0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com' \
              || { echo "::error::scripts/sync-clients.env: '$id' is not a Google client ID"; exit 1; }
          done
          test "$web" != "$android" || { echo "::error::scripts/sync-clients.env: the Web and Android client IDs are the same"; exit 1; }
          printf '%s' "$play" | grep -Eqx '([0-9A-F]{2}:){19}[0-9A-F]{2}' \
            || { echo "::error::scripts/sync-clients.env: PLAY_SIGNING_SHA1 is not a SHA-1 fingerprint (AA:BB:… in capitals)"; exit 1; }
          # that it is not the upload key's is checked by pwa's android.yml
          # (check.yml's android job: pwa-ref, play-signing-sha1)
          printf '%s' "$dropbox" | grep -Eqx '[a-z0-9]{8,64}' \
            || { echo "::error::scripts/sync-clients.env: DROPBOX_CLIENT_ID is not a Dropbox app key"; exit 1; }
          echo "Play app signing SHA-1: $play"
          {
            echo "## Sync clients"
            echo
            echo "All are committed in \`scripts/sync-clients.env\`."
            echo
            echo "| Name | |"
            echo "|---|---|"
            echo "| Google Web application client | \`$web\` |"
            echo "| Google Android client (upload key) | \`$android\` |"
            echo "| Play app signing SHA-1 | \`$play\` |"
            echo "| Dropbox app key (Quire reader) | \`$dropbox\` |"
            echo
            echo "## Entries to register"
            echo
            echo "* Google, Web application client: JavaScript origins \`https://bats-lang.github.io\` and \`http://localhost:3737\`; scope \`https://www.googleapis.com/auth/drive.appdata\`."
            echo "* Google, Android clients: package \`dev.middlefield.quire\`, one with the upload key's SHA-1 (printed in the summary of check.yml's android job) and one with Play's."
            echo "* Dropbox: redirect URIs \`https://bats-lang.github.io/quire/?oauth=dropbox\`, \`http://localhost:3737/?oauth=dropbox\`, \`quire://oauth/dropbox\`; scopes \`files.content.read\`, \`files.content.write\`; App folder; public clients (PKCE) allowed."
          } >> "$GITHUB_STEP_SUMMARY"
