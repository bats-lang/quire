# The form of every pull request body, one lint for every repository of the organisation
# (bats-lang/repository-prototype#487): the first line is Fixes #N, one ticket, a Head line
# that is the head, one generated-by footer. The result is the commit status text-lint on the
# head, set again on every edit of the body. The work is the shared text-lint-check.yml,
# called by commit; tools-ref is the same commit (a reusable workflow cannot read its own).
name: text-lint

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  statuses: write

jobs:
  text-lint:
    uses: bats-lang/repository-prototype/.github/workflows/text-lint-check.yml@9fda271897b8592202b32cd7072c03380e3d6750 # repository-prototype main 9fda271
    with:
      tools-ref: 9fda271897b8592202b32cd7072c03380e3d6750
